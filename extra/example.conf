upstream django {
    server 192.168.1.49:1112;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name teste-indicadores.hospitalsamur.com.br 192.168.1.49;
    return 301 https://teste-indicadores.hospitalsamur.com.br$request_uri;
}

server {
    listen 443 ssl;
    server_name teste_indicadores.hospitalsamur.com.br;
    
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/private.key;
            
# --- Security Headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    
# --- Timeouts ---
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;

# ——————————————————————————————
# Global Error Handling
# ——————————————————————————————

    # Actual Can't Find Page (HTML)
    error_page 404 /404.html;
    location = /404.html {
        root /var/www/html; 
        internal;
    }

    # Redirect to login (Passing the original requested URL as 'next')
    location @redirect_login {
        return 302 /login?next=$request_uri;
    }

    # Custom JSON 401 for API routes (Prevents breaking frontend fetch/XHR calls)
    location @api_err401 {
        default_type application/json;
        return 401 '{"error":"Unauthorized"}';
    }

    error_page 502 /502.html;
    location = /502.html {
        root /var/www/html; 
        internal;
    }

    # ——————————————————————————————
    # 1) SPA static or dev server
    # ——————————————————————————————
    location / {
        proxy_pass http://127.0.0.1:1111;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ——————————————————————————————
    # 2) Login endpoint (no auth)
    # ——————————————————————————————
    location /api_gateway/ {
        proxy_pass         http://django;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # ——————————————————————————————
    # 3) Internal validate subrequest
    # ——————————————————————————————
    location = /_auth {
        internal;
        proxy_pass              http://django/api_gateway/v1/users/validate;
        proxy_pass_request_body off;
        proxy_set_header        Host $host;
        proxy_set_header        X-Service-ID $service_id;
        proxy_set_header        Content-Length "";
        proxy_set_header        Cookie $http_cookie;
        # Optional: Let Django know what URL the user was trying to access
        proxy_set_header        X-Original-URI $request_uri; 
    }


# —————————————————————————————— #
# ID:6 Dashboard pacientes CPOE
# —————————————————————————————— #
    
    # Frontend/Page Route -> Redirects to Login on 401
    location /painel_pacientes_cpoe/ {
        set $service_id 6;
        auth_request /_auth;
        
        # We redirect pages directly to login
        error_page 401 = @redirect_login; 

        proxy_pass http://192.168.1.64:5113/;
        proxy_http_version 1.1;

        sub_filter_types text/html;
        sub_filter_once off;
        sub_filter '/assets/' '/painel_pacientes_cpoe/assets/';
    }

# Backend/API Route -> Returns JSON on 401
    location /api/enfermaria_status_cpoe/ {
        set $service_id 6;
        auth_request /_auth;
        
        # We return JSON 401 for APIs so frontend fetch requests don't fail parsing HTML
        error_page 401 = @api_err401; 

        proxy_pass http://192.168.1.64:5013/enfermaria_status_cpoe/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}