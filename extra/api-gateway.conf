upstream FRONTEND_ADDR {
    server 127.0.0.1:1111;
}
upstream BACKEND_ADDR {
    server 127.0.0.1:1112;
}

# Redirect old domain to new HTTPS
server {
    listen 80;
    server_name indicadores.samur.br;
    return 301 https://indicadores.hospitalsamur.com.br$request_uri;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name indicadores.hospitalsamur.com.br 192.168.1.52;
    return 301 https://indicadores.hospitalsamur.com.br$request_uri;
}

server {
    listen 443 ssl;
    server_name indicadores.hospitalsamur.com.br;

    # 1. Global Auth (This applies to ALL locations below)
    auth_request /_auth;

    # 2. Global Variable Capture (Extract Django headers for the whole server)
    auth_request_set $auth_user_id $upstream_http_x_user_id;
    auth_request_set $auth_user_name $upstream_http_x_user_name;

    # 3. Global Logging (Using the asset filter we discussed)
    access_log /var/log/nginx/gateway_traffic.log gateway_json if=$is_not_asset;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/private.key;
            
# --- Security Headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    
# --- Timeouts ---
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;
    
# ——————————————————————————————
# Global Error Handling
# ——————————————————————————————
    
    # Actual Can't Find Page (HTML)
    error_page 404 /404.html;
    location = /404.html {
        root /var/www/html; 
        internal;
    }

    # Redirect to login (Passing the original requested URL as 'next')
    location @redirect_login {
        return 302 /login?next=$request_uri;
    }

    # Custom JSON 401 for API routes (Prevents breaking frontend fetch/XHR calls)
    location @api_err401 {
        default_type application/json;
        return 401 '{"error":"Unauthorized"}';
    }
    
    # Custom JSON 403 for API routes
    location @api_err403 {
        default_type application/json;
        return 403 '{"error":"Forbidden", "message":"You do not have permission for this service"}';
    }
    
    # New Access Denied Page
    error_page 403 /403.html;
    location = /403.html {
        root /var/www/html;
        internal;
    }

    error_page 502 /502.html;
    location = /502.html {
        root /var/www/html; 
        internal;
    }

# ——————————————————————————————
# 1) SPA static or dev server
# ——————————————————————————————
    location / {
        auth_request off;
        proxy_pass http://FRONTEND_ADDR;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    
    location /api_gateway/ {
        auth_request off;
        proxy_pass http://BACKEND_ADDR;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

# ——————————————————————————————
# 3) Internal validate subrequest
# ——————————————————————————————
    location = /_auth {
        internal;
        proxy_pass              http://BACKEND_ADDR/api_gateway/v1/users/validate;
        proxy_pass_request_body off;
        proxy_set_header        Host $host;
        proxy_set_header        X-Service-ID $service_id;
        proxy_set_header        Content-Length "";
        proxy_set_header        Cookie $http_cookie;
        # Optional: Let Django know what URL the user was trying to access
        proxy_set_header        X-Original-URI $request_uri; 
    }
    
# Allow everyone to see the login page
    location /login {
        auth_request off;
        proxy_pass http://FRONTEND_ADDR;
    }
    
# Allow everyone to see static assets (optional, but saves CPU)
    location /assets/ {
        auth_request off;
        proxy_pass http://FRONTEND_ADDR;
    }



# System generated paths

    # ------------------------------ #
# ID:4 Painel relatórios STI
# ------------------------------ #
    location /painel_busca_relatorios/ {
        set $service_id 4;
        error_page 401 = @redirect_login;

        proxy_pass http://192.168.1.64:5111/;
        proxy_http_version 1.1;
    }
    # Painel relatórios STI Backend
    location /painel_busca_relatorios_API/ {
