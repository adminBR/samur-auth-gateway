#ip of the django backend
upstream django {
  server 192.168.2.131:1112;

#testing server
#  server 192.168.1.7:8001;
}


server {
  listen 80;
  server_name 192.168.2.131;
  set $dashboards 192.168.1.64;

# ——————————————————————————————
# 1) SPA static or dev server
# ——————————————————————————————
  location / {
    proxy_pass http://127.0.0.1:1111;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

# ——————————————————————————————
# 2) Login endpoint (no auth)
# ——————————————————————————————
  location = /api_gateway/v1/users/login/ {
    proxy_pass         http://django;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
  }

# ——————————————————————————————
# 3) Internal validate subrequest
# ——————————————————————————————
  location = /_auth {
      internal;
      proxy_pass              http://django/api_gateway/v1/users/validate;
      proxy_pass_request_body off;
      proxy_set_header        Host $host;
      proxy_set_header        X-Service-ID $service_id;
      proxy_set_header        Content-Length "";
      proxy_set_header        Cookie $http_cookie;
  }

# Catch-all for other /api routes (like /validate)
  location /api_gateway/ {
    proxy_pass         http://django;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
  }


# ——————————————————————————————
# service 1) painel de relatorios
# ——————————————————————————————
  location /painel_relatorios/ {
    set $service_id 4;
    auth_request /_auth;
    
    proxy_pass http://192.168.1.64:5111/;
    proxy_http_version 1.1;
  
    # Fix asset loading by rewriting URLs (very basic)
    sub_filter_types text/html;
    sub_filter_once off;
    sub_filter '/assets/' '/painel_relatorios/assets/';
  }
  
  location /api/report_manager_api/ {
    set $service_id 4; 
    auth_request /_auth; 
    proxy_pass http://192.168.1.64:5011/report_manager_api/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

      ## passing cookie token and other headers to the destination
    proxy_set_header Origin "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization $http_authorization;
  }


# ——————————————————————————————
# service 2) painel de pacientes
# ——————————————————————————————
  location /painel_pacientes/ {
    set $service_id 5;
    #auth_request /_auth;
    
    proxy_pass http://192.168.1.64:5112/;
    proxy_http_version 1.1;
  
    # Fix asset loading by rewriting URLs (very basic)
    sub_filter_types text/html;
    sub_filter_once off;
    sub_filter '/assets/' '/painel_pacientes/assets/';
  }
  
  location /api/enfermaria_status/ {
    set $service_id 5; 
    #auth_request /_auth; 
    proxy_pass http://$dashboards:5112; 
                                      
  
    proxy_set_header Host $host; 
                                 
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }


