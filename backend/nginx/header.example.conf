upstream FRONTEND_ADDR {
    server 127.0.0.1:1111;
}
upstream BACKEND_ADDR {
    server 127.0.0.1:1112;
}


# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name teste-indicadores.hospitalsamur.com.br 192.168.1.49;
    return 301 https://teste-indicadores.hospitalsamur.com.br$request_uri;
}

server {
    listen 443 ssl;
    server_name teste-indicadores.hospitalsamur.com.br;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/private.key;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Timeouts
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;

    # Global error handling
    error_page 404 /404.html;
    location = /404.html {
        root /var/www/html;
        internal;
    }

    location @redirect_login {
        return 302 /login?next=$request_uri;
    }

    location @api_err401 {
        default_type application/json;
        return 401 '{"error":"Unauthorized"}';
    }

    error_page 502 /502.html;
    location = /502.html {
        root /var/www/html;
        internal;
    }

    # SPA static or dev server
    location / {
        proxy_pass http://FRONTEND_ADDR;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api_gateway/ {
        proxy_pass http://BACKEND_ADDR;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Internal validate subrequest
    location = /_auth {
        internal;
        proxy_pass http://BACKEND_ADDR/api_gateway/v1/users/validate;
        proxy_pass_request_body off;
        proxy_set_header Host $host;
        proxy_set_header X-Service-ID $service_id;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
    }

    # System generated paths
    {{SYSTEM_GENERATED_PATHS}}
}
